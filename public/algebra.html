<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALG501 | Aula de álgebra</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17233c;font:16px system-ui}header{background:#142b50;color:white;padding:22px max(5vw,20px);display:flex;align-items:center;gap:20px;flex-wrap:wrap}header b{font-size:22px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:10px 14px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#142b50}button{cursor:pointer}button.primary{background:#2458b5;color:white;border:0}main{max-width:1080px;margin:auto;padding:30px 18px}h1{font-size:clamp(30px,5vw,48px);margin:10px 0}h2{margin-top:0}p{line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.card,article{background:white;border:1px solid #dce3ee;border-radius:14px;padding:22px;margin-bottom:15px}small{color:#60728c}progress{width:100%;accent-color:#2458b5}details{padding:12px 0;border-top:1px solid #e1e7f0}summary{cursor:pointer;font-weight:600}.formula{background:#eef3fa;padding:14px;border-radius:8px;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}footer{text-align:center;color:#60728c;padding:24px}</style><header><b>ALG501 / Aula</b><nav id="nav"></nav></header><main id="app"></main><footer>Material independiente de práctica · Progreso guardado en este navegador</footer><script>
const modules=[['Números complejos y matrices', ['Forma binómica','Operaciones con complejos','Módulo y conjugado','Ecuaciones polinómicas','Forma polar','Teorema de De Moivre','Matrices']],['Sistemas y geometría analítica',['Determinantes e inversa','Ecuaciones matriciales','Operaciones de fila','Rango','Rouché–Frobenius','Cramer y Gauss–Jordan','Aplicaciones de sistemas','Distancia y punto medio','Rectas','Distancia a rectas','Circunferencia','Parábola']],['Cónicas y vectores',['Elipse','Hipérbola','Espacio tridimensional','Esfera','Vectores','Producto punto']],['Geometría espacial',['Producto cruz','Triple producto escalar','Rectas en 3D','Posición relativa de rectas','Planos','Relaciones entre rectas y planos']]];
const data=[
['z=a+bi; i²=−1','Identifica Re(3−7i) e Im(3−7i).','3 y −7','El coeficiente de i es la parte imaginaria.'],['(a+bi)(c+di)=(ac−bd)+(ad+bc)i','Multiplica (2+i)(3−2i).','8−i','Distribuye y sustituye i² por −1.'],['|z|=√(a²+b²); conjugado=a−bi','Calcula módulo y conjugado de 5+12i.','13; 5−12i','√(25+144)=13.'],['x²=−k ⇒ x=±i√k','Resuelve x²+49=0.','±7i','Aísla x² y toma ambas raíces.'],['z=r(cos θ+i sen θ)','Expresa 2i en forma polar.','r=2, θ=90°','El punto está sobre el eje imaginario positivo.'],['zⁿ=rⁿ(cos nθ+i sen nθ)','Eleva (cos 30°+i sen 30°) a la cuarta potencia.','−1/2+i√3/2','Multiplica el ángulo por 4.'],['(AB)ᵢⱼ=Σ aᵢₖbₖⱼ','Multiplica la fila (2,3) por la columna (4,−1).','5','2·4+3·(−1)=5.'],['det A=ad−bc','Calcula det [[4,2],[3,5]].','14','20−6=14.'],['AX=B ⇒ X=A⁻¹B si A es invertible','Resuelve 3X=I.','X=I/3','Divide cada entrada de I entre 3.'],['Rᵢ←Rᵢ+kRⱼ','Aplica R₂←R₂−2R₁ a filas (1,3),(2,8).','(0,2)','Resta (2,6) de (2,8).'],['Rango = número de pivotes','Halla rango de [[1,2],[2,4]].','1','La segunda fila es múltiplo de la primera.'],['Sistema compatible si rango(A)=rango(A|b)','Clasifica un sistema de 3 incógnitas con ambos rangos iguales a 2.','Infinitas soluciones','Hay una variable libre.'],['Cramer: xᵢ=det(Aᵢ)/det(A)','Resuelve x+y=7; x−y=1.','x=4, y=3','Suma ambas ecuaciones: 2x=8.'],['Define incógnitas y traduce las condiciones','Dos números suman 20 y difieren en 6.','13 y 7','x+y=20; x−y=6.'],['d=√((x₂−x₁)²+(y₂−y₁)²)','Distancia entre (1,2) y (4,6).','5','√(9+16)=5.'],['m=(y₂−y₁)/(x₂−x₁); y−y₁=m(x−x₁)','Recta por (1,2) con pendiente 3.','y=3x−1','Sustituye el punto en la fórmula.'],['d=|Ax+By+C|/√(A²+B²)','Distancia del origen a 3x+4y−10=0.','2','10/5=2.'],['(x−h)²+(y−k)²=r²','Centro y radio de (x−2)²+(y+3)²=16.','(2,−3); r=4','Lee los desplazamientos y extrae la raíz.'],['(x−h)²=4p(y−k)','Foco de x²=12y.','(0,3)','4p=12.'],['x²/a²+y²/b²=1; c²=a²−b²','Focos de x²/25+y²/9=1.','(±4,0)','c=√(25−9).'],['x²/a²−y²/b²=1; c²=a²+b²','Asíntotas de x²/9−y²/16=1.','y=±4x/3','Pendientes ±b/a.'],['d=√(Δx²+Δy²+Δz²)','Distancia de (0,0,0) a (2,3,6).','7','√(4+9+36)=7.'],['(x−h)²+(y−k)²+(z−l)²=r²','Radio de x²+y²+z²=81.','9','Extrae raíz cuadrada.'],['‖v‖=√(v₁²+v₂²+v₃²)','Norma de (1,2,2).','3','√(1+4+4)=3.'],['u·v=Σuᵢvᵢ','Producto punto de (2,1,3) y (1,−2,4).','12','2−2+12=12.'],['u×v=(u₂v₃−u₃v₂,u₃v₁−u₁v₃,u₁v₂−u₂v₁)','Calcula (1,0,0)×(0,1,0).','(0,0,1)','Aplica las tres componentes.'],['V=|u·(v×w)|','Volumen para u=(2,0,0), v=(0,3,0), w=(0,0,4).','24','2·3·4=24.'],['r=p+tv','Recta por (1,2,3) con dirección (2,0,1).','(1+2t,2,3+t)','Suma el vector escalado al punto.'],['Rectas paralelas si sus direcciones son proporcionales','¿Son paralelas las direcciones (1,2,3) y (2,4,6)?','Sí','La segunda es el doble de la primera.'],['Ax+By+Cz+D=0','Plano por (1,0,0) con normal (2,3,4).','2x+3y+4z−2=0','Sustituye el punto para hallar D.'],['Recta paralela al plano si n·v=0','¿Es paralela o está contenida una recta de dirección (1,−1,0) respecto a x+y+z=4?','Paralela o contenida','El producto punto es cero; hace falta un punto para distinguir.']];
let state=JSON.parse(localStorage.getItem('alg501-v1')||'{"done":[],"wrong":[]}');const save=()=>localStorage.setItem('alg501-v1',JSON.stringify(state));const topics=modules.flatMap((m,i)=>m[1].map(t=>({t,m:i})));const app=document.querySelector('#app');let timer;function page(s){clearInterval(timer);app.innerHTML=s;window.scrollTo(0,0)}function mark(i,k){let a=state[k];if(!a.includes(i))a.push(i);if(k==='done')state.wrong=state.wrong.filter(x=>x!==i);save();document.querySelectorAll('[data-status="'+i+'"]').forEach(e=>e.textContent=state.done.includes(i)?'Dominado':state.wrong.includes(i)?'Por repasar':'En estudio')}
function home(){page(`<small>CURSO DE ÁLGEBRA · 4 UNIDADES</small><h1>Aprende resolviendo.</h1><p>Estudia a tu ritmo, practica y comprueba tus conocimientos antes de cada parcial.</p><div class="card"><h2>Tu progreso</h2><progress max="31" value="${state.done.length}"></progress><p>${state.done.length} de 31 temas dominados · ${state.wrong.length} pendientes de repaso</p></div><div class="grid">${modules.map((m,i)=>`<div class="card"><small>PARCIAL ${i+1} · 25 %</small><h2>${m[0]}</h2><p>${m[1].length} temas</p><button class="primary" onclick="unit(${i})">Estudiar unidad</button></div>`).join('')}</div><div class="card"><h2>Plan sugerido</h2><p>Dedica 30 minutos a teoría, 60 a resolver problemas y 15 a revisar errores. Completa uno o dos temas al día y termina cada unidad con un simulacro.</p></div>`)}function exercise(i){let d=data[i];return `<article><small data-status="${i}">${state.done.includes(i)?'Dominado':state.wrong.includes(i)?'Por repasar':'En estudio'}</small><h2>${topics[i].t}</h2><h3>Concepto clave</h3><p class="formula">${d[0]}</p><h3>Ejercicio</h3><p>${d[1]}</p><details><summary>Ver pista</summary><p>Aplica la fórmula anterior e identifica los datos.</p></details><details><summary>Ver solución</summary><p>${d[3]}</p><b>Respuesta: ${d[2]}</b></details><div class="actions"><button onclick="mark(${i},'wrong')">Me equivoqué</button><button class="primary" onclick="mark(${i},'done')">Ya lo domino</button></div></article>`}function unit(m){page(`<small>PARCIAL ${m+1}</small><h1>${modules[m][0]}</h1><div class="actions"><button onclick="exam(${m})">Simulacro</button><button onclick="formulas(${m})">Formulario</button></div><br>${topics.map((t,i)=>t.m===m?exercise(i):'').join('')}`)}function formulas(m){page(`<h1>Formulario ${m+1}</h1>${topics.map((t,i)=>t.m===m?`<article><b>${t.t}</b><p class="formula">${data[i][0]}</p></article>`:'').join('')}`)}
function random(){let a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9),c=1+Math.floor(Math.random()*9),d=1+Math.floor(Math.random()*9),k=Math.floor(Math.random()*3),q=[`Determinante de [[${a},${b}],[${c},${d}]]`,`Producto punto de (${a},${b}) y (${c},${d})`,`Sistema x+y=${a+b}; x−y=${a-b}`][k],ans=[a*d-b*c,a*c+b*d,`x=${a}, y=${b}`][k];document.querySelector('#random').innerHTML=`<p>${q}</p><details><summary>Ver respuesta</summary><p>${ans}</p></details>`}function practice(){page(`<h1>Práctica</h1><article><h2>Generador aleatorio</h2><div id="random"></div><button onclick="random()">Nuevo ejercicio</button></article><h2>Repaso de errores</h2>${state.wrong.length?state.wrong.map(exercise).join(''):'<p>No hay errores registrados.</p>'}`);random()}function exam(m){let ids=topics.map((t,i)=>t.m===m?i:-1).filter(i=>i>=0);page(`<h1>Simulacro ${m+1}</h1><p>Resuelve en papel. Tiempo disponible: <b id="clock">30:00</b></p>${ids.map(i=>`<article><p>${data[i][1]}</p><input placeholder="Tu respuesta" aria-label="Respuesta"></article>`).join('')}<button class="primary" onclick="grade(${m})">Finalizar y revisar</button>`);let n=1800;timer=setInterval(()=>{n--;document.querySelector('#clock').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(n<=0)grade(m)},1000)}function grade(m){page(`<h1>Revisión del simulacro</h1><p>Compara con tus respuestas en papel y registra los errores. La revisión es manual.</p>${topics.map((t,i)=>t.m===m?exercise(i):'').join('')}`)}document.querySelector('#nav').innerHTML='<button onclick="home()">Inicio</button>'+modules.map((_,i)=>`<button onclick="unit(${i})">Parcial ${i+1}</button>`).join('')+'<button onclick="practice()">Práctica</button>';home();</script></html>
